# ScreenWalker — Example Scenario: Notepad Automation
# Demonstrates: launch, OCR find, template find, type, hotkey, assert_visible, screenshot
#
# Run:        python -m screenwalker run   scenarios/example_scenario.yaml
# Validate:   python -m screenwalker validate scenarios/example_scenario.yaml
# Dry-run:    python -m screenwalker run   scenarios/example_scenario.yaml --dry-run
# With vars:  python -m screenwalker run   scenarios/example_scenario.yaml --var greeting="Hi!"

name: Notepad Automation
description: |
  Opens Windows Notepad, types a greeting, saves the file via Ctrl+S,
  confirms the Save-As dialog appeared, enters a filename, and confirms.
  A final screenshot is taken for the run report.
version: "2"

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  greeting: "Hello from ScreenWalker!"
  filename: "sw_test_output.txt"

# ── Config overrides ──────────────────────────────────────────────────────────
config:
  timeouts:
    step_default: 20
    screenshot_delay: 0.3
  vision:
    ocr_engine: tesseract
    ocr_lang: eng
    template_threshold: 0.78
  logging:
    level: info
    save_screenshots: true

# ── Steps ─────────────────────────────────────────────────────────────────────
steps:

  # 1. Launch Notepad
  - id: launch_notepad
    description: "Open Notepad"
    action: launch
    target: "notepad.exe"
    wait_after: 2.0
    on_failure: abort

  # 2. Assert Notepad window is visible (OCR for title bar text)
  - id: assert_editor_open
    description: "Verify Notepad is visible"
    action: assert_visible
    find:
      method: ocr
      query: "Notepad"
      threshold: 0.65
    timeout: 15
    retries: 2
    on_failure: abort
    expect_screen: notepad_main

  # 3. Type the greeting into the text area (no prior click needed — focus is already there)
  - id: type_greeting
    description: "Type the greeting message"
    action: type
    text: "{{ greeting }}"
    wait_after: 0.3

  # 4. Press Ctrl+S to open Save As dialog
  - id: open_save_dialog
    description: "Open Save As with Ctrl+S"
    action: hotkey
    keys: ["ctrl", "s"]
    wait_after: 1.5

  # 5. Assert Save As dialog appeared and type the filename
  - id: type_filename
    description: "Enter filename in the Save As dialog"
    action: type
    text: "{{ filename }}"
    find:
      method: ocr
      query: "File name"
      threshold: 0.60
      offset: [150, 0]
    timeout: 10
    on_failure: skip
    expect_screen: save_as_dialog

  # 6. Confirm save and take a final screenshot
  - id: confirm_and_capture
    description: "Press Enter to confirm, then screenshot"
    action: hotkey
    keys: ["enter"]
    wait_after: 1.0

  - id: final_screenshot
    description: "Capture final state"
    action: screenshot
    label: "after_save"

# ── Screen fingerprints (used by ScreenStateAnalyzer) ─────────────────────────
screens:

  notepad_main:
    required_texts:
      - "Notepad"
    forbidden_texts:
      - "Save As"
    optional_texts:
      - "File"
      - "Edit"
      - "View"
    match_threshold: 0.60

  save_as_dialog:
    required_texts:
      - "Save As"
    forbidden_texts: []
    optional_texts:
      - "File name"
      - "Save"
      - "Cancel"
    match_threshold: 0.65

# ── Teardown (always runs, even after failure) ─────────────────────────────────
teardown:
  - id: teardown_screenshot
    description: "Capture state at end of run"
    action: screenshot
    label: "teardown_final"
